spring.main.web-application-type=none
spring.main.banner-mode=off

ldap.authentication-enabled=${LDAP_AUTHENTICATION_ENABLED:true}
ldap.url=${LDAP_URL:ldaps://AD.SBI:3269}
ldap.search-url=${LDAP_SEARCH_URL:${ldap.url}}
ldap.bind-url=${LDAP_BIND_URL:${ldap.url}}
ldap.base-dn=${LDAP_BASE_DN:DC=AD,DC=SBI}
ldap.user-search-filter=${LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
ldap.service-account.dn=${LDAP_SERVICE_ACCOUNT_DN:CN=SA_SCF_FO_PROD,OU= AD,OU=SBI,CN=Users,DC=AD,DC=SBI}
ldap.service-account.password=${LDAP_SERVICE_ACCOUNT_PASSWORD:3041@Credable}
ldap.pool.enabled=${LDAP_POOL_ENABLED:true}
ldap.pool.max-active=${LDAP_POOL_MAX_ACTIVE:10}
ldap.pool.max-idle=${LDAP_POOL_MAX_IDLE:5}
ldap.pool.min-idle=${LDAP_POOL_MIN_IDLE:2}
ldap.pool.max-wait=${LDAP_POOL_MAX_WAIT:3000}
ldap.ssl.truststore-path=${LDAP_SSL_TRUSTSTORE_PATH:classpath:truststore/ldap-truststore.jks}
ldap.ssl.truststore-password=${LDAP_SSL_TRUSTSTORE_PASSWORD:changeit}
ldap.ssl.truststore-type=${LDAP_SSL_TRUSTSTORE_TYPE:JKS}
ldap.connect-timeout=${LDAP_CONNECT_TIMEOUT:5000}
ldap.read-timeout=${LDAP_READ_TIMEOUT:5000}

ldap.test.user-id=${LDAP_TEST_USER_ID:1084670}
ldap.test.password=${LDAP_TEST_PASSWORD:3041@Scf#}
